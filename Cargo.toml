[workspace]
resolver = "2"
members = [
  "crates/bezel-core",
  "crates/bezel-host-webview",
  "crates/bezel-cli",
  "crates/bezel-conformance",
  "sdk/rust",
  "examples/counter-rust",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jpflueger/bezel"
rust-version = "1.94"

[workspace.dependencies]
# Versions are a starting point from the Sep 2026 ecosystem snapshot; run `cargo update` and pin.
wasmtime = { version = "46", features = ["component-model", "component-model-async", "async", "cranelift"] }
wasmtime-wasi = { version = "46", features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tao = "0.30"
wry = "0.47"
clap = { version = "4", features = ["derive"] }
notify = "7"
